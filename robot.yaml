serial_number: a200-0000
version: 0
system:
  username: huskya200
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
    # Default middleware: Fast DDS, simple discovery.
    # For zenoh, uncomment (router config: zenoh_router.json5):
    # middleware:
    #   implementation: rmw_zenoh_cpp
    #   profile: /etc/clearpath/zenoh_router.json5

platform:
  controller: ps5
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
