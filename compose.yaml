# Run this on the companion computer that is wired to the Husky MCU. Run only
# one platform stack per robot, because two would publish duplicate
# /a200_0000/* topics.
services:
  platform:
    build: .
    image: husky-platform:latest
    container_name: husky-platform
    restart: unless-stopped
    network_mode: host
    # Share /dev/shm with the host so Fast DDS shared-memory transport works
    # with other ROS containers on the same host.
    ipc: host
    # The entrypoint runs from the mounted directory, so an edit to it only
    # needs a container restart, not an image rebuild.
    entrypoint: ["bash", "/config/entrypoint.sh"]
    volumes:
      - .:/config:ro
      - /dev:/dev
      - ./data:/data
    # These rules allow access to three device types: 188 is ttyUSB (the MCU),
    # 13 is input (the joystick) and 242 is hidraw (used to read the gamepad's
    # link quality). The hidraw number can differ between hosts, so check it
    # with `grep hidraw /proc/devices`.
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 13:* rmw"
      - "c 238:* rmw"
    # These let the controller_manager run its update thread with real-time
    # (SCHED_FIFO) priority.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
    stop_grace_period: 20s
    environment:
      # This only applies when zenoh is enabled. Set it to "0" if the host
      # already runs a zenoh router that the container should join.
      START_ZENOH_ROUTER: "1"
      RCUTILS_COLORIZED_OUTPUT: "0"
