# Run on the companion computer wired to the Husky MCU. Only one platform
# stack per robot: two would publish duplicate /a200_0000/* topics.
services:
  platform:
    build: .
    image: husky-platform:latest
    container_name: husky-platform
    restart: unless-stopped
    network_mode: host
    # Share /dev/shm with the host so Fast DDS shared-memory transport works
    # with other ROS containers on the same host.
    ipc: host
    # Run the mounted entrypoint so edits need a restart, not a rebuild.
    entrypoint: ["bash", "/config/entrypoint.sh"]
    volumes:
      - .:/config:ro
      - /dev:/dev
      - ./data:/data
    # Device majors: 188 ttyUSB (MCU), 13 input (joystick), 242 hidraw (pad
    # link quality). hidraw's major varies: check `grep hidraw /proc/devices`.
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 13:* rmw"
      - "c 242:* rmw"
    # SCHED_FIFO for the controller_manager update thread.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
    stop_grace_period: 20s
    environment:
      # Zenoh only: set to "0" if the host already runs a zenoh router.
      START_ZENOH_ROUTER: "1"
      RCUTILS_COLORIZED_OUTPUT: "0"
